spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/seed/sql/data.sql
  jpa:
    defer-datasource-initialization: false
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  issuer: test-issuer
  secret-key: test-secret-key
  expiration:
    access-token: 1h
    refresh-token: 24h
